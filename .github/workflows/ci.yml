name: CI

# При каждом коммите и Pull Request: стиль кода и тесты с покрытием.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen  # окна тестируются без экрана
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Форматирование (black)
        run: python -m black --check gm_hub main.py tests
      - name: Стиль кода (flake8)
        run: python -m flake8 gm_hub main.py tests
      - name: Тесты с покрытием
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=85
