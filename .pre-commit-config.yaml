# Перед каждым коммитом код форматируется black и проверяется flake8.
# Хуки берут black и flake8 из виртуального окружения проекта (.venv).
# Установка: pip install -r requirements-dev.txt, затем pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: .venv/Scripts/python.exe -m black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: .venv/Scripts/python.exe -m flake8
        language: system
        types: [python]
